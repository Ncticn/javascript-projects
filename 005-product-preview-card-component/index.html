<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./styles.css">
    <title>Frontend Mentor | Product Preview Card Component</title>
</head>

<body>
    <main>
        <article class="product-preview-card">
            <picture class="product-preview-card-image">
                <source media="(min-width: 26.375rem)" srcset="./assets/images/image-product-desktop.jpg"
                    type="image/jpeg">
                <img src="./assets/images/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum">
            </picture>
            <div class="product-preview-card-content">
                <div class="product-preview-card-content-header">
                    <span class="product-preview-card-content-header-tag text-preset-4">
                        PERFUME
                    </span>
                    <h1 class="product-preview-card-content-header-title text-preset-1">
                        Gabrielle Essence Eau De Parfum
                    </h1>
                    <p class="product-preview-card-content-header-description text-preset-3">
                        A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.
                    </p>
                </div>
                <div class="product-preview-card-content-price">
                    <p class="text-preset-1">$149.99</p>
                    <del class="text-preset-5">$169.99</del>
                </div>
                <button type="button" class="btn text-preset-2">
                    <img src="./assets/icons/icon-cart.svg" alt="">
                    Add to Cart
                </button>
            </div>
        </article>
    </main>
</body>

</html>
