<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Time Tracking Dashboard</title>
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
</head>

<body>

    <div class="card-activity card-activity__work">
        <div class="card-activity__inner">
            <div class="card-activity__header">
                <h2 class="card-activity__title text-preset-5">Work</h2>
                <button type="button" class="card-activity__header-btn">
                    <svg width="21" height="5" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z" />
                    </svg>
                </button>
            </div>
            <div class="card-activity__main">
                <p class="card-activity__time text-preset-1">32hrs</p>
                <p class="card-activity__last-time text-preset-6">Last Week - 36hrs</p>
            </div>
        </div>
    </div>
    
</body>

</html>
