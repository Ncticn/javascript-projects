name: Deploy Projects

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout javascript-projects
        uses: actions/checkout@v5

      - name: Prepare deployment
        run: |
          mkdir deploy

          for project in */; do
            if [ -f "$project/index.html" ]; then
              cp -r "$project" "deploy/"
            fi
          done

      - name: Deploy to ncticn.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: ncticn/ncticn.github.io
          publish_branch: main
          publish_dir: ./deploy
