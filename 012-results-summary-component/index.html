<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Results Summary Component</title>
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
</head>

<body>

    <button type="button" aria-label="Continue" class="text-md font-bold">
        Continue
    </button>

    <div class="summary-item" data-state="summary-item__reaction">
        <div class="summary-item__label">
            <img src="./assets/icons/icon-reaction.svg" alt="">
            <h3 class="text-preset-5 font-medium">Reaction</h3>
        </div>
        <div class="summary-item__score">
            <p class="text-preset-6 font-bold">80</p>
            <p class="text-preset-6 font-bold">/ 100</p>
        </div>
    </div>

</body>

</html>
