<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Blog Preview Card</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="shortcut icon" href="./assets/favicon/favicon-32x32.png" type="image/x-icon">
</head>

<body>
    <main>
        <article class="blog-card">
            <div class="blog-card-wrapper">
                <figure class="blog-card-image-wrapper">
                    <img src="./assets/images/illustration-article.svg" alt="Image Illustration" class="blog-card-image">
                </figure>
                <div class="blog-card-content-wrapper">
                    <span class="blog-card-tag">
                        Learning
                    </span>
                    <p class="blog-card-published-date">
                        Published <time datetime="2023-12-21">21 Dec 2023</time>
                    </p>
                    <h1 class="blog-card-title">
                        HTML & CSS foundations
                    </h1>
                    <p class="blog-card-description">
                        These languages are the backbone of every website, defining structure, content, and
                        presentation.
                    </p>
                </div>

                <div class="blog-card-author-wrapper">
                    <img src="./assets/images/image-avatar.webp" alt="Author Image Avatar" class="blog-card-author-image">
                    <p class="blog-card-author-name">
                        Greg Hooper
                    </p>
                </div>
            </div>
        </article>
    </main>
</body>

</html>
