<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Order Summary Component</title>
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <main>
        <article class="card-order-summary">
            <div class="card-order-summary__image-wrapper">
                <img src="./assets/images/illustration-hero.svg" alt="" class="card-order-summary__image">
            </div>
            <div class="card-order-summary__container">
                <div class="card-order-summary__content">
                    <h1 class="card-order-summary_title text-preset-2 font-black">Order Summary</h1>
                    <p class="card-order-summary_description text-preset-4 font-medium">
                        You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you
                        like!
                    </p>
                </div>

                <div class="card-pricing">
                    <div class="card-pricing__wrapper">
                        <div class="card-pricing__content">
                            <div class="card-pricing__icon">
                                <img src="./assets/icons/icon-music.svg" alt="">
                            </div>
                            <div class="card-pricing__info">
                                <p class="card-pricing__plan text-preset-4 font-black">Annual Plan</p>
                                <p class="card-pricing__price text-preset-4 font-medium">$59.99/year</p>
                            </div>
                        </div>

                        <a href="#" class="card-pricing__link text-preset-4 font-bold">Change</a>
                    </div>
                </div>

                <div class="card-order-summary__buttons">
                    <button type="button" class="btn btn-primary text-preset-4 font-black">Proceed to Payment</button>
                    <button type="button" class="btn btn-cancel text-preset-4 font-black">Cancel Order</button>
                </div>
            </div>

        </article>

    </main>
</body>

</html>
