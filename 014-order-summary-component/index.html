<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Order Summary Component</title>
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <main>
        <button type="button" class="btn btn-primary text-preset-3 font-black">Proceed to Payment</button>

        <div class="card-pricing">
            <div class="card-pricing__wrapper">
                <div class="card-pricing__content">
                    <div class="card-pricing__icon">
                        <img src="./assets/icons/icon-music.svg" alt="">
                    </div>
                    <div class="card-pricing__info">
                        <p class="card-pricing__plan text-preset-4 font-black">Annual Plan</p>
                        <p class="card-pricing__price text-preset-4 font-medium">$59.99/year</p>
                    </div>
                </div>

                <a href="#" class="card-pricing__link text-preset-4 font-bold">Change</a>
            </div>
        </div>

    </main>
</body>

</html>
