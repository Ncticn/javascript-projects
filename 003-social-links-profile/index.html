<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Social Links Profile</title>
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <main>
        <article class="profile-card">
            <figure class="profile-card-image-wrapper">
                <img src="./assets/images/avatar-jessica.jpeg" alt="Profile Avatar" class="profile-card-image">
            </figure>

            <div class="profile-card-name-location">
                <h1 class="profile-card-name text-preset-1">
                    Jessica Randall
                </h1>
                <p class="profile-card-location text-preset-3">
                    London, United Kingdom
                </p>
            </div>

            <p class="profile-card-description text-preset-2">
                "Front-end developer and avid reader."
            </p>

            <div class="social-links">
                <a href="#" class="social-link text-preset-3">
                    Github
                </a>
                <a href="#" class="social-link text-preset-3">
                    Frontend Mentor
                </a>
                <a href="#" class="social-link text-preset-3">
                    LinkedIn
                </a>
                <a href="#" class="social-link text-preset-3">
                    Twitter
                </a>
                <a href="#" class="social-link text-preset-3">
                    Instagram
                </a>
            </div>
        </article>
    </main>
</body>

</html>
